<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 004</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
    <div id="app">
        <h2>Meus filmes favoritos:</h2>
        <ul>
            <li v-for="(filme, index) in filmes" :key="index">{{ filme }}</li>
        </ul>
    </div>

    <script>
        const {createApp} = Vue

        createApp({
            data(){
                return {
                    filmes: ["Rambo", "Rocky", "Três Homens em Conflito", "Conan, o Bárbaro", "Feitiço de Áquila"]
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
