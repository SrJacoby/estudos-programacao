<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 003</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
    <div id="app">
        <p>{{contador}}</p>
        <button @click="mostrar = !mostrar">
            {{mostrar ? "Esconder" : "Mostrar"}} texto
        </button>

        <p v-if="mostrar">Este texto aparece e desaparece! Dê adeus para ele!</p>
    </div>

    <script>
        const {createApp} = Vue

        createApp({
            data(){
                return {
                    mostrar: true
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
