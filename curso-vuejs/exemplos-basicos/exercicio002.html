<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo 002</title>
    <script src="https://unpkg.com/vue@3"></script>
</head>
<body>
    <div id="app">
        <p>{{contador}}</p>
        <button @click="contador++">Clique aqui</button>
    </div>

    <script>
        const {createApp} = Vue

        createApp({
            data(){
                return {
                    contador: 0
                }
            }
        }).mount('#app')
    </script>
</body>
</html>
